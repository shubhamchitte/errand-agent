[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat-based errand agent with mocked home-service tools"
requires-python = ">=3.12"
dependencies = ["anthropic", "claude-agent-sdk", "rich", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["errand_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
